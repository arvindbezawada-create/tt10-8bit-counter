# Tiny Tapeout project information
project:
  title: "8-bit Binary Counter"
  description: "A clean 8-bit synchronous binary counter targeting SkyWater 130."
  how_it_works: "Increments the counter register on every rising clock edge when input bit 0 is pulled high."
  how_to_test: "Pull rst_n low to clear, apply 1 to ui_in[0], and cycle the clock to watch outputs change."

inputs:
  - "enable"
  - "unused"
  - "unused"
  - "unused"
  - "unused"
  - "unused"
  - "unused"
  - "unused"
outputs:
  - "bit_0"
  - "bit_1"
  - "bit_2"
  - "bit_3"
  - "bit_4"
  - "bit_5"
  - "bit_6"
  - "bit_7"

# Do not change!
yaml_version: 6
